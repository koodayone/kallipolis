services:
  neo4j:
    image: neo4j:5.18-community
    restart: unless-stopped
    # No public port mapping — reachable only via the compose network.
    # Browser access in dev: `docker compose exec neo4j cypher-shell ...`
    # or add a `docker-compose.override.yml` with `ports: ["7474:7474", "7687:7687"]`.
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_dbms_memory_transaction_total_max=2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    # Loopback-only on the host so Caddy (on the VM) is the only public
    # entry point. On localhost this means the backend is still reachable
    # at http://localhost:8000 during development.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_CLEANUP_MODEL=${GEMINI_CLEANUP_MODEL:-gemini-2.5-flash}
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

volumes:
  neo4j_data:
