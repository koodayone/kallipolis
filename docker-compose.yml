services:
  neo4j:
    image: neo4j:5.18-community
    restart: unless-stopped
    # No public port mapping — reachable only via the compose network.
    # Browser access in dev: `docker compose exec neo4j cypher-shell ...`
    # or add a `docker-compose.override.yml` with `ports: ["7474:7474", "7687:7687"]`.
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      # Page cache holds the working set of nodes/edges read from disk.
      # Default in 5.x without explicit setting is ~512 MB, which can't
      # hold all 22+ colleges' working sets simultaneously — first hit
      # of any college that's been evicted pays a cold disk read (5-15s
      # observed for /partnerships/opportunity/{soc} on the prod VM
      # before this setting was added). Sized at 4G for the 8 GB
      # e2-standard-2 (heap 2G + pagecache 4G + native ~500M +
      # backend ~400M + OS ~500M = ~7.4G of 8G; ~600 MB headroom).
      - NEO4J_server_memory_pagecache_size=4G
      - NEO4J_dbms_memory_transaction_total_max=2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    # Loopback-only on the host so Caddy (on the VM) is the only public
    # entry point. On localhost this means the backend is still reachable
    # at http://localhost:8000 during development.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # PYTHONUNBUFFERED=1 is load-bearing: docker compose exec -T
      # (non-TTY) block-buffers Python stdout, which silences logger
      # output during long-running jobs (description population,
      # classification, etc.) — the log only flushes at process exit.
      # This setting ensures every Python process in this container
      # emits output line-by-line, so progress is visible in real time.
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_CLEANUP_MODEL=${GEMINI_CLEANUP_MODEL:-gemini-2.5-flash}
      # Expose DRAFT (unpublished) landscape instances' API routes. Set to 1 in
      # the LOCAL .env only; prod's .env leaves it unset (default 0), so a draft
      # landscape without prod graph data never routes there. See
      # partnerships.landscape.routable_specs.
      - KALLIPOLIS_DRAFT_LANDSCAPES=${KALLIPOLIS_DRAFT_LANDSCAPES:-0}
      # Dashboard base the MCP server points its view-links at (the "two windows"
      # link target). Defaults to the deployed atlas; override to a local atlas
      # (e.g. http://localhost:3001) for a fully-local two-windows loop.
      - KALLIPOLIS_ATLAS_URL=${KALLIPOLIS_ATLAS_URL:-https://preview.kallipolis.us}
      # OAuth (resource-server mode). Empty by default => OAuth OFF, the /mcp-oauth
      # endpoint is not mounted, and the bearer-gated /mcp is unaffected. Set all
      # three to turn on the OAuth endpoint (issuer = the WorkOS AuthKit domain,
      # audience = this server's OAuth MCP URL). See mcp_server.auth.
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER:-}
      - MCP_OAUTH_AUDIENCE=${MCP_OAUTH_AUDIENCE:-}
      - MCP_OAUTH_JWKS_URL=${MCP_OAUTH_JWKS_URL:-}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - /var/lib/kallipolis/cache:/var/lib/kallipolis/cache
      - /var/lib/kallipolis/logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*

volumes:
  neo4j_data:
