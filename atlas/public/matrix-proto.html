<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Coverage Matrix — 26-college density test</title>
<style>
  :root{ --bg:#0a0e17; --panel:#0f1420; --line:rgba(255,255,255,.08); --mut:#5e6a83; --txt:rgba(255,255,255,.85); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  header{padding:18px 24px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:40;}
  h1{font-size:15px;margin:0 0 4px;letter-spacing:.02em;}
  .sub{font-size:12px;color:var(--mut);}
  .controls{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;align-items:center;}
  .grp{display:flex;align-items:center;gap:8px;}
  .grp > span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);}
  button.tog{background:transparent;border:1px solid var(--line);color:var(--mut);font-size:11.5px;padding:5px 11px;border-radius:7px;cursor:pointer;transition:.15s;font-weight:600;}
  button.tog.on{color:#0a0e17;border-color:transparent;}
  .count{font-size:11px;color:var(--mut);margin-left:auto;}
  .wrap{padding:14px 24px 40px;}
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);max-height:76vh;}
  .grid{display:grid;}
  .corner{position:sticky;left:0;top:0;z-index:30;background:var(--panel);}
  .colhead{position:sticky;top:0;z-index:20;background:var(--panel);height:128px;border-bottom:1px solid var(--line);}
  .colhead .lab{position:absolute;bottom:8px;left:calc(50% - 2px);transform-origin:left bottom;transform:rotate(-46deg);white-space:nowrap;font-size:11px;font-weight:600;color:#9aa6bd;display:flex;align-items:center;gap:5px;}
  .colhead .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  /* vertical header variant */
  .grid.vert .colhead{height:132px;}
  .grid.vert .colhead .lab{bottom:10px;left:50%;transform-origin:center;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;display:block;}
  .grid.vert .colhead .dot{display:none;}
  .rowlab{position:sticky;left:0;z-index:10;background:var(--panel);padding:0 12px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;}
  .rowlab .nm{font-size:12px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rowlab .cd{font-size:9.5px;color:var(--mut);margin-top:1px;}
  .cell{border-bottom:1px solid rgba(255,255,255,.04);display:flex;cursor:pointer;transition:transform .1s, box-shadow .1s;}
  .cell:hover{transform:translateY(-1px);}
  .cell .sw{flex:1;margin:4px;border-radius:6px;min-height:26px;}
  .drill{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;min-height:54px;}
  .drill .pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;margin-right:8px;}
  .legend{display:flex;gap:26px;align-items:center;margin-top:14px;font-size:12px;color:#9aa6bd;flex-wrap:wrap;}
  .legend .sw{width:34px;height:18px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:8px;}
  .note{font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.5;max-width:960px;}
</style></head>
<body>
<header>
  <h1>Coverage Matrix — full-width density test <span class="mono" style="color:var(--mut);font-size:12px">/matrix-proto</span></h1>
  <div class="sub">Real data: all 26 Bay colleges &times; the worst-case sector. Cells are clickable drill-in targets.</div>
  <div class="controls">
    <div class="grp"><span>Sector</span><button class="tog" data-k="ds" data-v="business">Business</button><button class="tog" data-k="ds" data-v="adm">Adv Mfg</button></div>
    <div class="grp"><span>Rows</span><button class="tog" data-k="ax" data-v="programs">Programs</button><button class="tog" data-k="ax" data-v="occupations">Occupations</button></div>
    <div class="grp"><span>Headers</span><button class="tog" data-k="hd" data-v="vertical">Vertical</button><button class="tog" data-k="hd" data-v="diagonal">Diagonal 45&deg;</button></div>
    <div class="grp"><span>Columns</span><button class="tog" data-k="gr" data-v="colleges">26 colleges</button><button class="tog" data-k="gr" data-v="districts">District rollup</button></div>
    <div class="count" id="count"></div>
  </div>
</header>
<div class="wrap">
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="legend" id="legend"></div>
  <div class="drill" id="drill">Click any cell to see what it would drill into.</div>
  <div class="note" id="note"></div>
</div>
