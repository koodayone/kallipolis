name: Docs Audit

# Run the deterministic documentation audit on every PR (and pushes
# to main). The audit is pure stdlib and runs in under a second, so
# the cost of running it unconditionally is negligible — and dropping
# the path filter keeps the required-check rule satisfied on PRs that
# don't touch any of the audit's target paths (e.g., workflow-only
# PRs). The earlier path-filtered version blocked merge of those PRs
# because GitHub branch protection treats a non-running required
# check as pending forever.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    name: Run documentation audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run audit check tests
        run: python -m pytest tools/docs-audit/tests/ -v

      - name: Run documentation audit
        run: python tools/docs-audit/audit.py
