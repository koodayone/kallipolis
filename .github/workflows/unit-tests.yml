name: Backend unit tests

# pytest runs the backend's unit tests AND its graph-backed invariant tests. A seeded,
# ephemeral Neo4j (the service container below, loaded from evals/seed.json.gz) makes the
# @requires_graph invariants — cross-tool referential integrity, offering integrity, and
# Bind/Gate/Distinguish over the live graph — RUN in CI instead of silently skipping. Still
# no LLM and no network. Always runs on every PR (and pushes to main) so branch protection's
# required-check rule is satisfied even on UI-only PRs. With uv-driven installs and a cached
# uv resolution directory the workflow completes in well under a minute on warm cache.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    # Ephemeral Neo4j for the @requires_graph invariants, loaded from the committed seed
    # fixture (a small, reproducible slice of the real graph — see backend/evals/). GitHub
    # waits for the health check before any step runs, so the seed load always finds it up.
    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/evalpass123
          NEO4J_server_memory_pagecache_size: 256M
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p evalpass123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: evalpass123

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements.txt'

      - name: Set up Python 3.11
        # Prod runs on 3.11; we test against the same major version.
        # uv venv below pins the venv to this interpreter.
        run: uv python install 3.11

      - name: Install dependencies
        # Use a uv-managed venv rather than --system: Ubuntu runners
        # mark /usr as externally-managed (PEP 668), and the venv is
        # the idiomatic uv pattern anyway. uv resolves and installs
        # an order of magnitude faster than pip.
        run: |
          uv venv --python 3.11
          uv pip install -r backend/requirements.txt pytest

      - name: Load eval seed graph
        # Creates the schema constraints + loads the committed slice into the service Neo4j,
        # so the @requires_graph invariants run against real (if small) data instead of skipping.
        working-directory: backend
        run: ../.venv/bin/python -m evals.seed

      - name: Run unit + graph-backed tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest -v
