name: Backend unit tests

# pytest runs the backend's pure-logic unit tests. Fast (under half a
# second on a clean checkout) and pure Python — no database, no LLM
# calls, no network. Always runs on every PR (and pushes to main) so
# branch protection's required-check rule is satisfied even on UI-only
# PRs that don't touch backend/. With uv-driven installs and a cached
# uv resolution directory the workflow completes in ~10s.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements.txt'

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # uv resolves and installs an order of magnitude faster than pip
        # (~3-5s vs 30-45s on this requirements set). --system installs
        # against the runner's Python rather than creating a venv we
        # don't need for a single test invocation.
        run: uv pip install --system -r backend/requirements.txt pytest

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -v
