name: Backend unit tests

# pytest runs the backend's pure-logic unit tests. Fast (under half a
# second on a clean checkout) and pure Python — no database, no LLM
# calls, no network. Always runs on every PR (and pushes to main) so
# branch protection's required-check rule is satisfied even on UI-only
# PRs that don't touch backend/. With uv-driven installs and a cached
# uv resolution directory the workflow completes in ~10s on warm cache.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements.txt'

      - name: Set up Python 3.11
        # Prod runs on 3.11; we test against the same major version.
        # uv venv below pins the venv to this interpreter.
        run: uv python install 3.11

      - name: Install dependencies
        # Use a uv-managed venv rather than --system: Ubuntu runners
        # mark /usr as externally-managed (PEP 668), and the venv is
        # the idiomatic uv pattern anyway. uv resolves and installs
        # an order of magnitude faster than pip.
        run: |
          uv venv --python 3.11
          uv pip install -r backend/requirements.txt pytest

      - name: Run unit tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest -v
